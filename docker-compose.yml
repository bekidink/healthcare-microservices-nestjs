name: healthcare-ecosystem

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Official Apache image (KRaft mode, no ZooKeeper needed) — the
    # bitnami/kafka images this originally used are no longer published to
    # Docker Hub under pullable tags (Broadcom moved Bitnami's distribution
    # after acquiring it), so this uses Apache's own image instead.
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT for container-to-container traffic
      # (services running inside docker-compose reach it as kafka:9092) and
      # PLAINTEXT_HOST for a service running directly on the host machine
      # during local dev (reaches it as localhost:9094). Without the second
      # one, a host-side client's initial bootstrap connection on :9092
      # succeeds, but every subsequent produce/fetch fails once it follows
      # the broker's metadata to the kafka:9092 advertised address, which
      # isn't resolvable outside the compose network.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # minio: intentionally not included yet. MinIO's images now require
  # registry authentication to pull (both Docker Hub and quay.io returned
  # 401 as of this writing), and no service through Milestone 1 actually
  # needs object storage. Add it back — with working credentials/an
  # alternative S3-compatible image — when a phase that needs it (documents,
  # imaging) actually lands.

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      IDENTITY_SERVICE_URL: http://identity:3001
      FACILITY_SERVICE_URL: http://facility:3002
      PATIENT_SERVICE_URL: http://patient:3003
      SCHEDULING_SERVICE_URL: http://scheduling:3004
      CLINICAL_SERVICE_URL: http://clinical:3005
      LAB_SERVICE_URL: http://lab:3006
      PHARMACY_SERVICE_URL: http://pharmacy:3007
      FINANCE_SERVICE_URL: http://finance:3008
      COMMUNICATION_SERVICE_URL: http://communication:3009
      INPATIENT_SERVICE_URL: http://inpatient:3010
      SUPPLY_SERVICE_URL: http://supply:3011
      INTEROP_SERVICE_URL: http://interop:3012
      ANALYTICS_SERVICE_URL: http://analytics:3013
      JWT_ACCESS_SECRET: dev-access-secret-change-me
    depends_on:
      - identity
      - facility
      - patient
      - scheduling
      - clinical
      - lab
      - pharmacy
      - finance
      - communication
      - inpatient
      - supply
      - interop
      - analytics

  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/identity_db?schema=public
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: identity-service
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  facility:
    build:
      context: .
      dockerfile: apps/facility/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/facility_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: facility-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  patient:
    build:
      context: .
      dockerfile: apps/patient/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/patient_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: patient-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  scheduling:
    build:
      context: .
      dockerfile: apps/scheduling/Dockerfile
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/scheduling_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: scheduling-service
      FACILITY_SERVICE_URL: http://facility:3002
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      facility:
        condition: service_started

  clinical:
    build:
      context: .
      dockerfile: apps/clinical/Dockerfile
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/clinical_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: clinical-service
      SCHEDULING_SERVICE_URL: http://scheduling:3004
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      scheduling:
        condition: service_started

  lab:
    build:
      context: .
      dockerfile: apps/lab/Dockerfile
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/lab_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: lab-service
      CLINICAL_SERVICE_URL: http://clinical:3005
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clinical:
        condition: service_started

  pharmacy:
    build:
      context: .
      dockerfile: apps/pharmacy/Dockerfile
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/pharmacy_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: pharmacy-service
      CLINICAL_SERVICE_URL: http://clinical:3005
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clinical:
        condition: service_started

  finance:
    build:
      context: .
      dockerfile: apps/finance/Dockerfile
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/finance_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: finance-service
      CLINICAL_SERVICE_URL: http://clinical:3005
      JWT_ACCESS_SECRET: dev-access-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clinical:
        condition: service_started

  communication:
    build:
      context: .
      dockerfile: apps/communication/Dockerfile
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      PORT: 3009
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/communication_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: communication-service
      SCHEDULING_SERVICE_URL: http://scheduling:3004
      JWT_ACCESS_SECRET: dev-access-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      scheduling:
        condition: service_started

  inpatient:
    build:
      context: .
      dockerfile: apps/inpatient/Dockerfile
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/inpatient_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: inpatient-service
      CLINICAL_SERVICE_URL: http://clinical:3005
      JWT_ACCESS_SECRET: dev-access-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clinical:
        condition: service_started

  supply:
    build:
      context: .
      dockerfile: apps/supply/Dockerfile
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/supply_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: supply-service
      JWT_ACCESS_SECRET: dev-access-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  interop:
    build:
      context: .
      dockerfile: apps/interop/Dockerfile
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      PORT: 3012
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/interoperability_db?schema=public
      PATIENT_SERVICE_URL: http://patient:3003
      CLINICAL_SERVICE_URL: http://clinical:3005
    depends_on:
      postgres:
        condition: service_healthy
      patient:
        condition: service_started
      clinical:
        condition: service_started

  analytics:
    build:
      context: .
      dockerfile: apps/analytics/Dockerfile
    restart: unless-stopped
    ports:
      - "3013:3013"
    environment:
      PORT: 3013
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/analytics_db?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: analytics-service
      PHARMACY_SERVICE_URL: http://pharmacy:3007
      PATIENT_SERVICE_URL: http://patient:3003
      CLINICAL_SERVICE_URL: http://clinical:3005
      JWT_ACCESS_SECRET: dev-access-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pharmacy:
        condition: service_started

volumes:
  pgdata:
  kafkadata:
