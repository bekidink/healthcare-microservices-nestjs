# Render Blueprint — see https://render.com/docs/blueprint-spec
#
# Free-tier topology. Render has no free private-service instance type and
# only one free/expiring Postgres per account, which ruled out the "real"
# microservices shape (one instance per service, Kafka as its own private
# service) without a paid plan. Instead:
#
# - All 5 backend processes (gateway + identity + facility + patient +
#   scheduling) run inside ONE free web service / ONE container, managed by
#   pm2-runtime (see infra/render/ecosystem.config.js). Only `gateway` binds
#   Render's public $PORT; the other 4 listen on fixed ports reachable over
#   localhost inside that same container — exactly like running `pnpm dev`
#   locally without Docker, just co-located in one process group instead of
#   one Render private service each.
# - One free Postgres instance hosts all 4 logical databases (identity_db,
#   facility_db, patient_db, scheduling_db), mirroring the docker-compose
#   trick used for local dev. `infra/render/migrate-all.js` creates them
#   (idempotently) and runs each service's own `prisma migrate deploy`
#   against its own database — as the first step of container startup
#   (`infra/render/entrypoint.sh`), not a Render preDeployCommand, since
#   that feature isn't available on the free plan.
# - Kafka is dropped entirely — there's no way to run a real always-on
#   broker for free. KafkaService's connect is already best-effort (won't
#   crash the service), and each write is still audited synchronously in
#   the same DB transaction as the state change (AuditEvent) — only the
#   async Kafka propagation dimension is missing here. OutboxEvent rows
#   will retry and eventually land in FAILED after MAX_ATTEMPTS. Revisit
#   once this needs to actually run on paid infrastructure.
# - REDIS_URL is dropped too — grep confirmed nothing in the codebase
#   actually uses it yet (scaffolded, never wired), so there's nothing to
#   lose by not standing up a Redis instance for this deploy.
#
# Known limitations of bundling 5 Node processes into one free instance:
# - RAM is shared and capped (free web services get 512MB) across all 5 —
#   fine for a demo/smoke-test load, not for anything resembling production.
# - Free web services spin down after inactivity; the next request cold-
#   starts all 5 processes together, which takes noticeably longer than a
#   single-service cold start — and now also re-runs the migration check
#   (fast no-op once already applied, but adds a few seconds every time).
#
# Thing most likely to have drifted from Render's current schema by the
# time you read this — fix from the blueprint-import error message if so:
# the free Postgres `plan: free` value/availability itself (Render's free
# database tier terms/limits change more often than instance types do).

databases:
  - name: healthcare-db
    databaseName: healthcare
    user: healthcare
    plan: free

services:
  - type: web
    name: healthcare-app
    runtime: docker
    plan: free
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # tighten to your real frontend origin(s) once known
